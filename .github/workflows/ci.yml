name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The OpenCode source shells out to sqlite3, and its most
      # drift-sensitive tests skip themselves when it is absent. A test that
      # silently disappears from the suite is not coverage.
      - name: Install source dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3 lsof

      - name: Download deps
        run: go mod download

      # One script, so the gate cannot drift between local runs, CI and the
      # release workflow.
      - name: Verify
        run: ./scripts/verify
